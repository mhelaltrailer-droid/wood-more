# Wood & More — API + Web app
#
# Database: put DATABASE_URL in backend/.env (e.g. Neon: ...?sslmode=require). The API uses it
# when set; see backend/server.js. Do not commit real credentials.
#
# Optional local PostgreSQL (no Neon): comment out DATABASE_URL in backend/.env and run:
#   docker compose --profile local-db up --build

services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wood_more
      POSTGRES_USER: wood_more
      POSTGRES_PASSWORD: wood_more
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wood_more -d wood_more"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Explicit fallbacks only when DATABASE_URL is not in backend/.env (local-db profile).
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-wood_more}
      PGUSER: ${PGUSER:-wood_more}
      PGPASSWORD: ${PGPASSWORD:-wood_more}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./config.api.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - api

volumes:
  postgres_data:
