# Wood & More — API + Web app
#
# `docker compose up --build` runs everything locally, including PostgreSQL seeded from
# backend/init-db.sql.
#
# To use a cloud database instead (e.g. Neon), put DATABASE_URL in backend/.env
# (...?sslmode=require) — it takes precedence over the PG* settings below — and skip the local
# database with: docker compose up --build api app
# Do not commit real credentials.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wood_more
      POSTGRES_USER: wood_more
      POSTGRES_PASSWORD: wood_more
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wood_more -d wood_more"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Used only when DATABASE_URL is not set in backend/.env.
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-wood_more}
      PGUSER: ${PGUSER:-wood_more}
      PGPASSWORD: ${PGPASSWORD:-wood_more}
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./config.api.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - api

volumes:
  postgres_data:
