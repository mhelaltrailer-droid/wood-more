# Same as nginx.conf but without /api/ proxy — used when hostname "api" is not
# resolvable (e.g. Render Web Service). Browser calls API via apiBaseUrl in config.json.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
